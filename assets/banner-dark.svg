<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 840 244" width="840" height="244" role="img" aria-labelledby="t d">
  <title id="t">product engineer: observe, model, simplify, ship</title>
  <desc id="d">Four stages of one idea: a daisy found among scattered dots, a sketched wireframe, the same screen reduced to its essentials, and the finished piece shipped.</desc>
  <style>
    .ink { stroke: #e6edf3; }
    .ink-fill { fill: #e6edf3; }
    .muted { stroke: #8b949e; }
    .muted-fill { fill: #8b949e; }
    .accent-fill { fill: #46954a; }
    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .title { font: 700 27px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; text-anchor: middle; letter-spacing: 0.5px; }
    .label { font: 600 17px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; text-anchor: middle; }
    .caption { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .flow { stroke-dasharray: 1 8; animation: flow 1.1s linear infinite; }
    .bob { animation: bob 3.2s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -9; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .flow, .bob, .spin { animation: none; } }
  </style>

  <defs>
    <g id="petals">
      <ellipse cy="-5.4" rx="2.4" ry="4.2" />
      <ellipse cy="-5.4" rx="2.4" ry="4.2" transform="rotate(45)" />
      <ellipse cy="-5.4" rx="2.4" ry="4.2" transform="rotate(90)" />
      <ellipse cy="-5.4" rx="2.4" ry="4.2" transform="rotate(135)" />
      <ellipse cy="-5.4" rx="2.4" ry="4.2" transform="rotate(180)" />
      <ellipse cy="-5.4" rx="2.4" ry="4.2" transform="rotate(225)" />
      <ellipse cy="-5.4" rx="2.4" ry="4.2" transform="rotate(270)" />
      <ellipse cy="-5.4" rx="2.4" ry="4.2" transform="rotate(315)" />
    </g>
    <g id="daisy">
      <use href="#petals" fill="#fffdf5" />
      <circle r="2.8" fill="#f0b429" />
    </g>
    <g id="daisy-o">
      <use href="#petals" fill="#fffdf5" stroke="#8b949e" stroke-width="0.9" />
      <circle r="2.8" fill="#f0b429" />
    </g>
  </defs>

  <!-- connectors -->
  <g class="line muted" stroke-width="2.5">
    <path class="flow" d="M172 100H262" />
    <path d="M261 94l7 6-7 6" />
    <path class="flow" d="M372 100H462" />
    <path d="M461 94l7 6-7 6" />
    <path class="flow" d="M572 100H662" />
    <path d="M661 94l7 6-7 6" />
  </g>

  <!-- observe: one daisy among the noise -->
  <g transform="translate(120 100)">
    <g class="muted-fill">
      <circle cx="-30" cy="-22" r="3" />
      <circle cx="-8" cy="-34" r="2.5" />
      <circle cx="24" cy="-28" r="3" />
      <circle cx="36" cy="-4" r="2.5" />
      <circle cx="-36" cy="6" r="2.5" />
      <circle cx="-24" cy="-4" r="2" />
      <circle cx="-16" cy="26" r="3" />
      <circle cx="8" cy="34" r="2.5" />
      <circle cx="39" cy="34" r="2.5" />
    </g>
    <g transform="translate(2 -2)"><use class="spin" href="#daisy-o" /></g>
    <circle class="line ink" cx="2" cy="-2" r="16" stroke-width="2.5" />
    <path class="line ink" d="M14 10l13 13" stroke-width="4" />
  </g>

  <!-- model: a sketched wireframe -->
  <g transform="translate(320 100)">
    <rect class="line ink" x="-38" y="-32" width="76" height="64" rx="7" stroke-width="2.5" stroke-dasharray="6 5" />
    <g class="line muted" stroke-width="1.8">
      <path d="M-38 -20H38" />
      <rect x="-31" y="-13" width="20" height="38" rx="2" />
      <path d="M-4 -9H30M-4 -1H20" />
      <rect x="-4" y="6" width="34" height="19" rx="2" />
      <path d="M-4 6l34 19M30 6l-34 19" />
    </g>
    <g class="muted-fill">
      <circle cx="-30" cy="-26" r="1.7" />
      <circle cx="-24" cy="-26" r="1.7" />
    </g>
  </g>

  <!-- simplify: the same screen, only what it needs -->
  <g transform="translate(520 100)">
    <rect class="line ink" x="-38" y="-32" width="76" height="64" rx="7" stroke-width="2.5" />
    <path class="line ink" d="M-18 -8H18" stroke-width="3.5" />
    <rect class="accent-fill" x="-18" y="3" width="36" height="14" rx="7" />
  </g>

  <!-- ship: finished and out the door -->
  <g transform="translate(720 100)">
    <g class="bob">
      <g transform="rotate(-8)">
        <rect class="accent-fill" x="-38" y="-32" width="76" height="64" rx="7" />
        <path class="line" stroke="#ffffff" d="M-14 1l9 10 19-21" stroke-width="5.5" />
      </g>
    </g>
    <g transform="translate(51 -39) scale(0.95)"><use class="spin" href="#daisy-o" /></g>
    <g transform="translate(63 -17) scale(0.6)"><use class="spin" href="#daisy-o" /></g>
  </g>

  <!-- title -->
  <text class="title ink-fill" x="420" y="12">product engineer</text>

  <!-- labels -->
  <g class="label ink-fill">
    <text x="120" y="178">observe</text>
    <text x="320" y="178">model</text>
    <text x="520" y="178">simplify</text>
    <text x="720" y="178">ship</text>
  </g>
  <g class="caption muted-fill">
    <text x="120" y="200">find the real problem</text>
    <text x="320" y="200">mock it before building</text>
    <text x="520" y="200">cut what isn't needed</text>
    <text x="720" y="200">get it to real users</text>
  </g>
</svg>
