<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 224" width="840" height="224" role="img" aria-labelledby="t d">
  <title id="t">The Monday Number, a case study</title>
  <desc id="d">Two small pictures joined by an arrow. The ask: a pile of sketched charts. The need: an envelope holding a single number, labelled Monday. Beside them: The Monday Number, why product engineers still matter when AI writes the code. Play the story, under two minutes, narrated.</desc>
  <style>
    .ink { stroke: #e6edf3; }
    .ink-fill { fill: #e6edf3; }
    .muted { stroke: #8b949e; }
    .muted-fill { fill: #8b949e; }
    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .title { font: 700 26px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 0.3px; }
    .kick { font: 600 11px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 2.5px; }
    .label { font: 600 15px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; text-anchor: middle; }
    .mon { font: 700 9.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; text-anchor: middle; letter-spacing: 1.5px; }
    .pill { font: 600 13.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; text-anchor: middle; }
    .caption { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .small { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mid { text-anchor: middle; }
    .flow { stroke-dasharray: 1 8; animation: flow 1.1s linear infinite; }
    .bob { animation: bob 3.2s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -9; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .flow, .bob { animation: none; } }
  </style>

  <!-- the ask: more charts -->
  <g transform="translate(138 92)">
    <g class="line ink" stroke-width="2.2" stroke-dasharray="5 5">
      <rect x="-58" y="-52" width="52" height="42" rx="6" />
      <rect x="2" y="-58" width="56" height="44" rx="6" />
      <rect x="-36" y="0" width="60" height="44" rx="6" />
    </g>
    <g class="line muted" stroke-width="2">
      <path d="M-48 -20v-10M-39 -20v-18M-30 -20v-13M-21 -20v-24" />
      <path d="M11 -26l11-12 9 7 13-14" />
      <circle cx="-16" cy="22" r="11" />
      <path d="M-16 22v-11M-16 22l9 6" />
      <path d="M4 14h12M4 22h9M4 30h12" />
    </g>
  </g>

  <!-- connector -->
  <g class="line muted" stroke-width="2.5">
    <path class="flow" d="M214 92H262" />
    <path d="M261 86l7 6-7 6" />
  </g>

  <!-- the need: one number, waiting in the inbox -->
  <g transform="translate(326 98)">
    <g class="bob">
      <path class="line ink" stroke-width="2.5" d="M-27 -12V-53a5 5 0 0 1 5-5h44a5 5 0 0 1 5 5V-12" />
      <text class="mon ink-fill" x="0" y="-41">MON</text>
      <rect x="-17" y="-33" width="34" height="13" rx="6.5" fill="#46954a" />
    </g>
    <rect class="line ink" x="-42" y="-12" width="84" height="54" rx="7" stroke-width="2.5" />
    <path class="line ink" stroke-width="2.5" d="M-42 -7L0 20L42 -7" />
  </g>

  <g class="label ink-fill">
    <text x="138" y="172">the ask</text>
    <text x="326" y="172">the need</text>
  </g>
  <g class="small mid muted-fill">
    <text x="138" y="193">more charts</text>
    <text x="326" y="193">one number, by Monday 10am</text>
  </g>

  <!-- the words -->
  <text class="kick muted-fill" x="452" y="46">A CASE STUDY</text>
  <text class="title ink-fill" x="452" y="80">The Monday Number</text>
  <text class="caption muted-fill" x="452" y="106">why product engineers still matter</text>
  <text class="caption muted-fill" x="452" y="125">when AI writes the code</text>
  <rect x="452" y="144" width="176" height="36" rx="18" fill="#2d6a37" />
  <text class="pill" x="540" y="167" fill="#ffffff">play the story →</text>
  <text class="small muted-fill" x="642" y="167">under two minutes, narrated</text>
</svg>
